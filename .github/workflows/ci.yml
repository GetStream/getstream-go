name: build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep this job id: main requires the matrix checks by name, and calling through a
  # reusable workflow prefixes each with it.
  ci:
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit

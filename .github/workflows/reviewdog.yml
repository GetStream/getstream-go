name: reviewdog
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reviewdog:
    name: 🐶 Reviewdog
    # Read-only token: this job runs PR code, so findings are reported as
    # workflow annotations (github-pr-annotations) instead of review comments.
    # reviewdog only uses the token to read the PR diff.
    permissions:
      contents: read
      pull-requests: read # reviewdog reads the PR diff
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.19"

      - name: Install golangci-lint
        run: make install-golangci

      - name: Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run --out-format line-number \
            | reviewdog -f=golangci-lint -name=golangci-lint -reporter=github-pr-annotations

name: reviewdog
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Release PRs only bump the version and rewrite the changelog, so there is nothing here
# that has not already passed on the PR it came from. Skipping by `if:` still reports
# success, so a required status check stays satisfied.
jobs:
  reviewdog:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: 🐶 Reviewdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.19"

      - name: Install golangci-lint
        run: make install-golangci

      - name: Reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: $(go env GOPATH)/bin/golangci-lint run --out-format line-number | reviewdog -f=golangci-lint -name=golangci-lint -reporter=github-pr-review

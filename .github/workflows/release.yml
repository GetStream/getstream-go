name: Release

on:
  push:
    branches:
      - main
      - '*.x'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Reversible half: keep the Release PR current. Stands down only while a release is
  # already pending, because until that one is tagged there is no release commit to stop
  # the walk at and it would propose the same commits again in a second Release PR.
  release-pr:
    name: Release PR
    needs: detect
    if: needs.detect.outputs.pending != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-release: true

  # The tag is irreversible and, for Go, permanent: proxy.golang.org caches it forever.
  # So the suite has to run before it, which means knowing a release is pending before
  # the suite starts. The tag lands on the merged Release PR's merge commit while the
  # suite runs on this workflow's own commit, so `ready` also requires those to be the
  # same commit. They are, on the path that matters: the push of that merge.
  detect:
    name: Detect pending release
    if: github.ref_name == 'main' || endsWith(github.ref_name, '.x')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      pending: ${{ steps.find.outputs.pending }}
      ready: ${{ steps.find.outputs.ready }}
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - name: Find a merged Release PR waiting to be tagged
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          pending=false
          ready=false

          # Query the label directly. Listing closed PRs and filtering client-side loses
          # a release that has slipped past the first page, which reads as "nothing to
          # release" and passes. Filter before picking, too: a hotfix branch can hold
          # its own pending release, and taking the newest label match would drop this
          # branch's release on every run until the other one clears.
          nums="$(gh api "repos/${GITHUB_REPOSITORY}/issues" \
            -X GET -f state=closed -f labels='autorelease: pending' -f per_page=20 \
            --jq '.[] | select(.pull_request != null) | .number')"

          num=""
          sha=""
          for n in $nums; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" \
              --jq 'select(.merged_at != null and .base.ref == env.BASE) | .merge_commit_sha // empty')"
            if [ -n "$sha" ]; then
              num="$n"
              break
            fi
          done

          if [ -z "$sha" ]; then
            echo "No pending release on ${BASE}."
          elif [ "$sha" != "$HEAD_SHA" ]; then
            # Reached when an earlier release run failed after the Release PR merged.
            # Tagging $sha here would tag a tree this run never tested, and failing
            # would redden every later push, so stand down and say why.
            pending=true
            echo "::warning::Release PR #${num} is still pending at ${sha}, which is not this run's commit ${HEAD_SHA}. Re-run the workflow run for ${sha} to finish that release."
          else
            pending=true
            ready=true
            echo "Pending release #${num} will be tagged at ${sha}."
          fi

          {
            echo "pending=${pending}"
            echo "ready=${ready}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

      # Go resolves a v2+ module only if go.mod carries the matching /vN suffix,
      # release-please never rewrites it, and proxy.golang.org caches a tag permanently,
      # so a mismatch here would publish an uninstallable major.
      - name: Verify go.mod major matches the release about to be tagged
        if: steps.find.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.find.outputs.sha }}
        run: |
          at_sha() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/$1?ref=${SHA}" -H "Accept: application/vnd.github.raw"
          }
          version="$(at_sha .release-please-manifest.json | jq -r '.["."]')"
          expected="${version%%.*}"
          module_path="$(at_sha go.mod | sed -n 's/^module //p')"
          module_major="$(printf '%s' "$module_path" | sed -n 's|.*/v\([0-9][0-9]*\)$|\1|p')"
          [ -n "$module_major" ] || module_major=1
          if [ "$module_major" != "$expected" ]; then
            echo "::error::Release $version would be tagged at $SHA, where go.mod declares '$module_path' (major v$module_major)."
            echo "::error::That tag would be uninstallable and permanent. Migrate go.mod and every self-import to /v$expected BEFORE merging the major Release PR. See CONTRIBUTING.md."
            exit 1
          fi
          echo "Release $version will be tagged at $SHA, where go.mod is $module_path."

  tests:
    name: Tests
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit

  # Irreversible half.
  release:
    name: 🚀 Tag and release
    needs: [detect, tests]
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-pull-request: true

  # A push that lands while the release above is running is gated out of `release-pr`,
  # and nothing re-runs that half once the tag exists, so those commits would sit
  # unreleased until the next unrelated push. Run it again now that the walk has a
  # release commit to stop at.
  release-pr-followup:
    name: Release PR (after tagging)
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-release: true

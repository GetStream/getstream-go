name: Lint

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Release PRs only bump the version and rewrite the changelog, so there is nothing here
# that has not already passed on the PR it came from. Skipping by `if:` still reports
# success, so a required status check stays satisfied.
jobs:
  lint:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: 👮 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.19"

      - name: Tidy
        run: go mod tidy -v && git diff --no-patch --exit-code || { git status;  echo 'Unchecked diff, did you forget go mod tidy again?' ; false ; };

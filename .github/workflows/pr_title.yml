name: Lint PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr_title:
    name: 👮 Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ^(?!.*\b[A-Z][A-Z0-9]+-[0-9]+\b).+$
          subjectPatternError: The title becomes the public changelog line, so keep ticket IDs such as ABC-123 out of it and put the ticket in the branch name or the PR body. Write any other uppercase name and number without the dash, such as SHA256.

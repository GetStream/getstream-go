name: _run-tests

on:
  workflow_call:
    secrets:
      STREAM_API_SECRET:
        # Lives in the feeds-enabled-shard environment, not at repo level, so it is not
        # inheritable at call time; the job resolves it by declaring that environment below.
        required: false
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # True only for a Release PR opened by release-please itself. Keying on the branch name
  # alone would let any PR, a fork's included, name its branch release-please--x and skip
  # every required check, which branch protection then counts as satisfied.
  RELEASE_PR: >-
    ${{ github.event.pull_request.user.login == 'github-actions[bot]'
    && github.event.pull_request.head.repo.full_name == github.repository
    && startsWith(github.head_ref, 'release-please--') }}

# The guard sits on the steps here rather than on the job, unlike the other five SDKs. main
# requires the six matrix legs of test-build by name, and a job-level `if:` is evaluated
# before the matrix expands, which is why the matrix context is not available there. A
# skipped job would produce one check run instead of six, so those required contexts would
# never appear and the Release PR would sit blocked forever. Guarding the steps keeps every
# leg reporting while the 20-minute integration leg is the part that goes away.
jobs:
  test-build:
    name: 👷 Test & Build ${{ matrix.goVer }}${{ matrix.label }}
    environment: feeds-enabled-shard
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        goVer: ['1.19', '1.20', '1.21', '1.22', '1.23', '1.24']
        include:
          - goVer: '1.19'
            label: ' & Integration'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.goVer }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goVer }}

      - name: Unit tests via ${{ matrix.goVer }}
        if: matrix.goVer != '1.19' && env.RELEASE_PR != 'true'
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: go test -short -v -race ./...

      - name: Integration tests via ${{ matrix.goVer }}
        if: matrix.goVer == '1.19' && env.RELEASE_PR != 'true'
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: |
          go test -coverprofile cover.out -v -race -parallel 16 -timeout 20m ./...
          go tool cover -func=cover.out

      - name: Upload coverage to Codecov
        if: matrix.goVer == '1.19' && env.RELEASE_PR != 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover.out

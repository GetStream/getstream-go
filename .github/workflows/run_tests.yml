name: _run-tests

on:
  workflow_call:
    secrets:
      STREAM_API_SECRET:
        # Lives in the feeds-enabled-shard environment, not at repo level, so it is not
        # inheritable at call time; the job resolves it by declaring that environment below.
        required: false
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This job skips on a Release PR. release-please only bumps the version and rewrites the
# changelog, and every source commit in one already passed this suite on the PR it came
# from, so the only thing running it again can do is fail on a flaky integration test and
# hold up a release. The guard sits on the job rather than on the calling job in ci.yml,
# because a job skipped by `if:` reports success and satisfies a required status check,
# while a reusable workflow that is never called produces no check at all. It tests the
# author as well as the branch name: on its own, the name would let any PR, a fork's
# included, call its branch release-please--x and skip every required check, which branch
# protection counts as met. github.actor is the pusher rather than the PR author, so a
# human commit pushed onto the Release PR is tested like any other commit.
#
# lint.yml and reviewdog.yml stay unguarded on purpose: golangci-lint compiles the package,
# so they are the only check on release-please's rewrite of version.go.
jobs:
  test-build:
    if: >-
      ${{ !(github.actor == 'github-actions[bot]'
      && github.event.pull_request.user.login == 'github-actions[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'release-please--')) }}
    name: 👷 Test & Build ${{ matrix.goVer }}${{ matrix.label }}
    environment: feeds-enabled-shard
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        goVer: ['1.19', '1.20', '1.21', '1.22', '1.23', '1.24']
        include:
          - goVer: '1.19'
            label: ' & Integration'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.goVer }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goVer }}

      - name: Unit tests via ${{ matrix.goVer }}
        if: matrix.goVer != '1.19'
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: go test -short -v -race ./...

      - name: Integration tests via ${{ matrix.goVer }}
        if: matrix.goVer == '1.19'
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: |
          go test -coverprofile cover.out -v -race -parallel 16 -timeout 20m ./...
          go tool cover -func=cover.out

      - name: Upload coverage to Codecov
        if: matrix.goVer == '1.19'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover.out

name: _run-tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The unit lane declares no environment and receives no Stream credentials. Keep it that
# way: a fork PR gets no secrets and still goes green, and a live test added without
# skipIfShort fails here instead of passing against a live Stream app.
jobs:
  test-build:
    name: 🧪 Test & Build ${{ matrix.goVer }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goVer: ['1.19', '1.20', '1.21', '1.22', '1.23', '1.24']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.goVer }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goVer }}

      - name: Unit tests via ${{ matrix.goVer }}
        run: go test -short -v -race -coverprofile cover.out ./...

      - name: Upload coverage to Codecov
        if: matrix.goVer == '1.19'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover.out

name: _run-tests

on:
  workflow_call:
    secrets:
      STREAM_API_SECRET:
        # Lives in the feeds-enabled-shard environment, not at repo level, so it is not
        # inheritable at call time; the job resolves it by declaring that environment below.
        required: false
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Release PRs only bump the version and rewrite the changelog, and every commit in one
# already passed this suite on its own PR. The guard sits on each job, not on the caller,
# so a skipped job still reports success to a required status check.
jobs:
  test-build:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: 👷 Test & Build ${{ matrix.goVer }}${{ matrix.label }}
    environment: feeds-enabled-shard
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        goVer: ['1.19', '1.20', '1.21', '1.22', '1.23', '1.24']
        include:
          - goVer: '1.19'
            label: ' & Integration'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.goVer }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goVer }}

      - name: Unit tests via ${{ matrix.goVer }}
        if: matrix.goVer != '1.19'
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: go test -short -v -race ./...

      - name: Integration tests via ${{ matrix.goVer }}
        if: matrix.goVer == '1.19'
        env:
          STREAM_BASE_URL: ${{ vars.STREAM_BASE_URL }}
          STREAM_API_KEY: ${{ vars.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
        run: |
          go test -coverprofile cover.out -v -race -parallel 16 -timeout 20m ./...
          go tool cover -func=cover.out

      - name: Upload coverage to Codecov
        if: matrix.goVer == '1.19'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cover.out
